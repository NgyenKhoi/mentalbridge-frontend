name: Frontend quality

on:
  pull_request:
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main, dev]
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      IDENTITY_API_BASE_URL: http://127.0.0.1:9
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      CARE_BACKEND_DIRECTORY: ${{ github.workspace }}/mentalbridge-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out compatible Care test backend
        uses: actions/checkout@v4
        with:
          repository: NgyenKhoi/mentalbridge-backend
          ref: 590054d96354b361176417d9b3f9365657bc9601
          path: mentalbridge-backend

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mentalbridge-backend/care-service/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate generated Identity contract
        run: npm run contracts:check

      - name: Run unit, component, and API-boundary tests
        run: npm run test:unit

      - name: Build production application
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e
