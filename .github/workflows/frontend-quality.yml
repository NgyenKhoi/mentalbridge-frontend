name: Frontend quality

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - 'mobile/**'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/frontend-quality.yml'
      - '.github/workflows/staging-quality.yml'
  push:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - 'mobile/**'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/frontend-quality.yml'
      - '.github/workflows/staging-quality.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify frontend changes
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.classify.outputs.web }}
      mobile: ${{ steps.classify.outputs.mobile }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          web=false
          mobile=false
          if grep -Eq '^(mentalbridge/|AGENTS\.md$|CONTRIBUTING\.md$|\.github/workflows/(frontend-quality|staging-quality)\.yml$)' <<<"$changed_files"; then
            web=true
          fi
          if grep -Eq '^mobile/' <<<"$changed_files"; then
            mobile=true
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  quality:
    name: Frontend checks
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      IDENTITY_API_BASE_URL: http://127.0.0.1:9
      CONTENT_SERVICE_URL: http://127.0.0.1:3003
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Realtime provider contract ref
        id: realtime-provider
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          provider_ref=dev
          if [[ -n "$HEAD_REF" ]] && git ls-remote --exit-code --heads https://github.com/NgyenKhoi/mentalbridge-backend.git "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            provider_ref="$HEAD_REF"
          fi
          echo "ref=$provider_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Realtime provider contracts
        uses: actions/checkout@v4
        with:
          repository: NgyenKhoi/mentalbridge-backend
          ref: ${{ steps.realtime-provider.outputs.ref }}
          path: realtime-provider
          sparse-checkout: contracts/websocket/realtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate generated contracts
        run: npm run contracts:check

      - name: Validate Realtime generated contracts
        run: npm run contract:check

      - name: Compare Realtime provider schemas
        run: npm run contract:provider-check
        env:
          REALTIME_CONTRACT_SOURCE: ${{ github.workspace }}/realtime-provider/contracts/websocket/realtime

      - name: Run full unit, component, and API-boundary test suite
        run: npm run test:unit

      - name: Build production application
        run: npm run build

  quality-gate:
    name: quality-gate
    if: always()
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require applicable frontend checks
        env:
          CHANGE_CLASSIFICATION: ${{ needs.changes.result }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$CHANGE_CLASSIFICATION" != 'success' ]]; then
            echo "Change classification failed." >&2
            exit 1
          fi
          if [[ "$WEB_CHANGED" == 'true' && "$WEB_RESULT" != 'success' ]]; then
            echo "Required web checks did not pass." >&2
            exit 1
          fi

      - name: Report deferred mobile milestone
        if: needs.changes.outputs.mobile == 'true'
        run: >-
          echo "NOT_RUN (staging milestone pending): mobile cloud checks are intentionally deferred to the staging milestone."

      - name: Confirm quality gate
        run: echo "All checks required for this dev change passed."
