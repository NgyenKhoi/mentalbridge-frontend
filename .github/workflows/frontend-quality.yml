name: Frontend quality

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - 'mobile/**'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/frontend-quality.yml'
      - '.github/workflows/staging-quality.yml'
  push:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - 'mobile/**'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/frontend-quality.yml'
      - '.github/workflows/staging-quality.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      IDENTITY_API_BASE_URL: http://127.0.0.1:9
      CONTENT_SERVICE_URL: http://127.0.0.1:3003

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Realtime provider contract ref
        id: realtime-provider
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          provider_ref=dev
          if [[ -n "$HEAD_REF" ]] && git ls-remote --exit-code --heads https://github.com/NgyenKhoi/mentalbridge-backend.git "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            provider_ref="$HEAD_REF"
          fi
          echo "ref=$provider_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Realtime provider contracts
        uses: actions/checkout@v4
        with:
          repository: NgyenKhoi/mentalbridge-backend
          ref: ${{ steps.realtime-provider.outputs.ref }}
          path: realtime-provider
          sparse-checkout: contracts/websocket/realtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate generated contracts
        run: npm run contracts:check

      - name: Validate Realtime generated contracts
        run: npm run contract:check

      - name: Compare Realtime provider schemas
        run: npm run contract:provider-check
        env:
          REALTIME_CONTRACT_SOURCE: ${{ github.workspace }}/realtime-provider/contracts/websocket/realtime

      - name: Run full unit, component, and API-boundary test suite
        run: npm run test:unit

      - name: Build production application
        run: npm run build

  mobile-quality:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_BASE_URL: https://api.test.mentalbridge
      EXPO_PUBLIC_API_TIMEOUT_MS: '5000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mobile quality gate
        run: npm run quality

  mobile-android-smoke:
    name: Android native boot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_DEVICE: emulator-5554
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_BASE_URL: https://api.test.mentalbridge
      EXPO_PUBLIC_API_TIMEOUT_MS: '5000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile, install, and boot Android app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: npm run native:android:smoke

      - name: Upload Android native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-boot-${{ github.sha }}
          path: mobile/native-evidence
          if-no-files-found: warn

  mobile-ios-smoke:
    name: iOS native boot
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_BASE_URL: https://api.test.mentalbridge
      EXPO_PUBLIC_API_TIMEOUT_MS: '5000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Select and boot an iPhone Simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator is installed." >&2
            exit 1
          fi
          echo "IOS_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Compile, install, and boot iOS app
        run: npm run native:ios:smoke

      - name: Upload iOS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-boot-${{ github.sha }}
          path: mobile/native-evidence
          if-no-files-found: warn

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, mobile-quality, mobile-android-smoke, mobile-ios-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require frontend checks
        if: needs.quality.result != 'success' || needs.mobile-quality.result != 'success' || needs.mobile-android-smoke.result != 'success' || needs.mobile-ios-smoke.result != 'success'
        run: exit 1
      - name: Confirm quality gate
        run: echo "All required frontend quality checks passed."
