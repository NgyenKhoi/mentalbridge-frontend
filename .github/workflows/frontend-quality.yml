name: Frontend quality

on:
  pull_request:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [dev]
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      IDENTITY_API_BASE_URL: http://127.0.0.1:9
      CONTENT_SERVICE_URL: http://127.0.0.1:3003

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Realtime provider contracts
        uses: actions/checkout@v4
        with:
          repository: NgyenKhoi/mentalbridge-backend
          ref: dev
          path: realtime-provider
          sparse-checkout: contracts/websocket/realtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate generated contracts
        run: npm run contracts:check

      - name: Validate Realtime generated contracts
        run: npm run contract:check

      - name: Compare Realtime provider schemas
        run: npm run contract:provider-check
        env:
          REALTIME_CONTRACT_SOURCE: ${{ github.workspace }}/realtime-provider/contracts/websocket/realtime

      - name: Run unit, component, and API-boundary tests
        run: npm run test:unit

      - name: Install Chromium for Realtime browser tests
        run: npx playwright install --with-deps chromium

      - name: Run controlled Realtime browser tests
        run: npm run test:browser

      - name: Build production application
        run: npm run build

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, browser-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require frontend checks
        if: needs.quality.result != 'success' || needs.browser-e2e.result != 'success'
        run: exit 1
      - name: Confirm quality gate
        run: echo "All required frontend quality checks passed."

  browser-e2e:
    name: Browser E2E
    needs: [quality]
    if: needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      E2E_RUNTIME: fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npm run test:e2e:install
      - name: Build production standalone server
        run: npm run build
      - name: Run all required browser journeys
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            mentalbridge/playwright-report
            mentalbridge/test-results
          if-no-files-found: warn
