name: Frontend quality

on:
  pull_request:
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main, dev]
    paths:
      - 'mentalbridge/**'
      - '.github/workflows/frontend-quality.yml'

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mentalbridge
    env:
      CI: 'true'
      IDENTITY_API_BASE_URL: http://127.0.0.1:9

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mentalbridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate generated Identity contract
        run: npm run contracts:check

      - name: Run unit, component, and API-boundary tests
        run: npm run test:unit

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
