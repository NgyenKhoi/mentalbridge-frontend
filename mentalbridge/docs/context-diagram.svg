<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">MentalBridge System Context Diagram</title><desc id="desc">Detailed level-zero context diagram with separate concise data flows.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173f38" flood-opacity=".12"/></filter><marker id="ai" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#2f7569"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#b76d4f"/></marker>
<style>.t{font:700 31px 'Segoe UI',Arial;fill:#173f38}.sub{font:400 15px 'Segoe UI',Arial;fill:#64756f}.bd{fill:#f4f8f3;fill-opacity:.64;stroke:#789087;stroke-width:2;stroke-dasharray:10 8}.bl{font:700 13px 'Segoe UI',Arial;letter-spacing:.09em;fill:#536b63}.e{fill:#fff;stroke:#334f47;stroke-width:2;filter:url(#s)}.svc{fill:#fff8e7;stroke:#c49332}.et{font:700 18px 'Segoe UI',Arial;fill:#183e37;text-anchor:middle}.es{font:400 13px 'Segoe UI',Arial;fill:#6b756f;text-anchor:middle}.p{fill:#e7f2eb;stroke:#245f55;stroke-width:3;filter:url(#s)}.pt{font:700 30px 'Segoe UI',Arial;fill:#173f38;text-anchor:middle}.ps{font:400 14px 'Segoe UI',Arial;fill:#59716a;text-anchor:middle}.in{fill:none;stroke:#2f7569;stroke-width:2;marker-end:url(#ai)}.out{fill:none;stroke:#b76d4f;stroke-width:2;marker-end:url(#ao)}.lb{fill:#fff;fill-opacity:.97;stroke:#dce5df}.l{font:600 12px 'Segoe UI',Arial;fill:#263f39;text-anchor:middle}.g{font:700 11px 'Segoe UI',Arial;letter-spacing:.07em}.it{fill:#2f7569}.ot{fill:#b76d4f}.leg{font:600 12px 'Segoe UI',Arial;fill:#536760}</style></defs>
<rect width="1800" height="1200" fill="#fbfcf8"/><text x="900" y="46" class="t" text-anchor="middle">MentalBridge — System Context Diagram</text><text x="900" y="73" class="sub" text-anchor="middle">Level 0 · Detailed high-level data flows</text>
<rect x="560" y="250" width="680" height="760" rx="30" class="bd"/><rect x="595" y="234" width="280" height="32" rx="16" fill="#f4f8f3"/><text x="735" y="255" class="bl" text-anchor="middle">MENTALBRIDGE SYSTEM BOUNDARY</text>
<circle cx="900" cy="630" r="205" class="p"/><text x="900" y="574" class="g it" text-anchor="middle">PROCESS 0</text><text x="900" y="619" class="pt">MentalBridge</text><text x="900" y="651" class="ps">Mental Health Support Platform</text><text x="900" y="680" class="ps">Sàng lọc · Theo dõi · Kết nối chăm sóc</text>
