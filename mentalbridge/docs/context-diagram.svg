<rect x="690" y="100" width="420" height="88" rx="11" class="e"/><text x="900" y="137" class="et">User</text><text x="900" y="162" class="es">Người dùng nền tảng</text>
<rect x="45" y="285" width="335" height="94" rx="11" class="e svc"/><text x="212" y="324" class="et">External AI / LLM Service</text><text x="212" y="350" class="es">Dịch vụ phân tích ngôn ngữ và cảm xúc</text>
