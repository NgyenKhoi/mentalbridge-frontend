appId: com.mentalbridge.mobile
name: MB-631 app restart restores persisted conversation
---
- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Chào mừng bạn quay lại'
- scrollUntilVisible:
    element:
      text: 'Phiên trò chuyện'
    direction: DOWN
- tapOn: 'Phiên trò chuyện'
- tapOn: 'Mở phiên trò chuyện'
- extendedWaitUntil:
    visible:
      id: chat-composer
    timeout: 30000
- assertVisible: 'MB631 synthetic peer message'
- assertVisible: 'MB631 synthetic user message'
