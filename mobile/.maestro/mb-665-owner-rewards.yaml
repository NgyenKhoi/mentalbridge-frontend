# MB-665 staging-milestone flow. Authored on dev; NOT_RUN locally by design.
# The protected fixture must contain one verified unlock, one self-markable
# current-plan Bingo item and the same bookmark facts previously read on web.
appId: com.mentalbridge.mobile
name: MB-665 owner rewards, bookmarks and plan Bingo persistence
---
- launchApp:
    clearState: true
- tapOn: 'Tiếp tục'
- tapOn:
    id: 'sign-in-email-input'
- inputText: '${MAESTRO_MB_USER_EMAIL}'
- tapOn:
    id: 'sign-in-password-input'
- inputText: '${MAESTRO_MB_USER_PASSWORD}'
- hideKeyboard
- tapOn:
    id: 'sign-in-submit'
    retryTapIfNoChange: true
- assertVisible: 'Hôm nay của bạn'
- tapOn: 'Các khu vực khác'
- scrollUntilVisible:
    element:
      text: 'Bộ sưu tập và Bingo'
    direction: DOWN
- tapOn: 'Bộ sưu tập và Bingo'
- assertVisible: 'Bộ sưu tập và Bingo'
- assertVisible: '${MAESTRO_MB_ACHIEVEMENT_TITLE}'
- assertVisible: '${MAESTRO_MB_REWARD_POLICY_VERSION}'
- scrollUntilVisible:
    element:
      text: 'Bingo trong kế hoạch tuần này'
    direction: DOWN
- assertVisible: '${MAESTRO_MB_BINGO_VERIFIED_LABEL}'
- assertVisible: 'Content đã xác minh'
- tapOn:
    id: 'bingo-item-${MAESTRO_MB_BINGO_SELF_POSITION}'
- assertVisible: 'Bạn đã tự đánh dấu'
- takeScreenshot: mb-665-owner-rewards-verified
- launchApp
- tapOn: 'Các khu vực khác'
- scrollUntilVisible:
    element:
      text: 'Bộ sưu tập và Bingo'
    direction: DOWN
- tapOn: 'Bộ sưu tập và Bingo'
- scrollUntilVisible:
    element:
      text: 'Bạn đã tự đánh dấu'
    direction: DOWN
- assertVisible: 'Bạn đã tự đánh dấu'
- takeScreenshot: mb-665-owner-rewards-reloaded
