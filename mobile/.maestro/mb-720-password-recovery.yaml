appId: com.mentalbridge.mobile
name: MB-720 privacy-safe mobile password recovery
---
# Author-only evidence. NOT_RUN until the MB-666 staging/device gate is available.
# Any syntactically valid email is acceptable because acknowledgement is generic.
- launchApp:
    clearState: true
- tapOn: 'Tiếp tục'
- tapOn: 'Quên mật khẩu?'
- assertVisible: 'KHÔI PHỤC TÀI KHOẢN'
- assertVisible: 'Phản hồi luôn giống nhau để bảo vệ trạng thái tài khoản.'
- tapOn: 'Email'
- inputText: 'mb720-nonexistent@example.com'
- hideKeyboard
- tapOn:
    text: 'Gửi liên kết khôi phục'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Kiểm tra email của bạn.*Nếu tài khoản đủ điều kiện.*'
    timeout: 10000
- assertNotVisible: 'Không tìm thấy tài khoản'
- tapOn: 'Về trang đăng nhập'
- assertVisible: 'Tiếp tục hành trình của bạn'
