appId: com.mentalbridge.mobile
name: MB-626 reviewed resource catalogue to persisted progress
---
- launchApp:
    clearState: true
- tapOn: 'Tiếp tục'
- tapOn: 'Email'
- inputText: '${MAESTRO_MB_USER_EMAIL}'
- tapOn: 'Mật khẩu'
- inputText: '${MAESTRO_MB_USER_PASSWORD}'
- tapOn: 'Đăng nhập'
- assertVisible: 'Chào mừng bạn quay lại'
- tapOn: 'Khám phá tài nguyên'
- assertVisible: 'Chọn một nội dung phù hợp lúc này'
- tapOn: 'Bài đọc'
- scrollUntilVisible:
    element:
      text: 'Hiểu các dấu hiệu thường gặp của trầm cảm.*'
    direction: DOWN
- tapOn: 'Mở Hiểu các dấu hiệu thường gặp của trầm cảm.*'
- assertVisible: 'Hiểu các dấu hiệu thường gặp của trầm cảm.*'
- runFlow:
    when:
      visible: 'Đánh dấu hoàn thành'
    commands:
      - scrollUntilVisible:
          element:
            text: 'Đánh dấu hoàn thành'
          direction: DOWN
      - tapOn: 'Đánh dấu hoàn thành'
      - assertVisible: 'Đã lưu tiến độ.'
- assertVisible: 'Đã hoàn thành'
- scrollUntilVisible:
    element:
      text: '← Quay lại tài nguyên'
    direction: UP
- tapOn: '← Quay lại tài nguyên'
- assertVisible: 'Chọn một nội dung phù hợp lúc này'
- launchApp
- assertVisible: 'Chào mừng bạn quay lại'
- tapOn: 'Khám phá tài nguyên'
- tapOn: 'Bài đọc'
- scrollUntilVisible:
    element:
      text: 'Hiểu các dấu hiệu thường gặp của trầm cảm.*'
    direction: DOWN
- tapOn: 'Mở Hiểu các dấu hiệu thường gặp của trầm cảm.*'
- assertVisible: 'Đã hoàn thành'
