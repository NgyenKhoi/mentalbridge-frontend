appId: com.mentalbridge.mobile
name: MB-641 owned Emotion action explicit completion
---
# Author-only evidence. NOT_RUN until protected MB-666 native gate is available.
# Requires an approved disposable fixture with an ACTIVE native Emotion action
# scheduled for today and no pre-activation check-in. Never reset shared dev.
- launchApp:
    clearState: true
- tapOn: 'Tiếp tục'
- tapOn: 'Email'
- inputText: '${MAESTRO_MB_SUPPORT_PLAN_USER_EMAIL}'
- tapOn: 'Mật khẩu'
- inputText: '${MAESTRO_MB_SUPPORT_PLAN_USER_PASSWORD}'
- tapOn: 'Đăng nhập'
- assertVisible: 'Chào mừng bạn quay lại'
- tapOn: 'Mở kế hoạch hỗ trợ'
- scrollUntilVisible:
    element:
      text: 'Ghi nhận cảm xúc: Dành một phút nhìn lại cảm xúc'
    direction: DOWN
- assertVisible: 'Chưa ghi nhận hoàn thành'
- tapOn: 'Ghi nhận cảm xúc: Dành một phút nhìn lại cảm xúc'
- assertVisible: 'Đang ghi nhận cho hoạt động trong kế hoạch'
- tapOn: 'Tốt'
- tapOn: 'Mức cảm nhận 3'
- tapOn: 'Lưu ghi nhận'
- assertVisible: 'Đã lưu ghi nhận cảm xúc. Quay lại để kiểm tra hoạt động trong kế hoạch.'
- tapOn:
    id: 'emotion-return-to-plan'
- scrollUntilVisible:
    element:
      text: 'Bạn vừa quay lại từ ghi nhận cảm xúc'
    direction: DOWN
- assertVisible: 'Chưa ghi nhận hoàn thành'
- tapOn: 'Kiểm tra ghi nhận cho hoạt động vừa mở'
- assertVisible: 'Đã ghi nhận hoàn thành'
- tapOn: 'Kiểm tra ghi nhận cho hoạt động vừa mở'
- assertVisible: 'Đã ghi nhận hoàn thành'
- stopApp
- launchApp
- tapOn: 'Mở kế hoạch hỗ trợ'
- scrollUntilVisible:
    element:
      text: 'Đã ghi nhận hoàn thành'
    direction: DOWN
- assertVisible: 'Đã ghi nhận hoàn thành'
