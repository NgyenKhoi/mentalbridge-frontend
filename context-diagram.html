<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mental Bridge – Context Diagram (Level 0 DFD)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 50px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    p.subtitle {
      font-size: 13px;
      color: #555;
      margin-bottom: 24px;
    }
    svg {
      background: #fff;
      border: 1px solid #dde1e7;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 100%;
    }

    /* Entity boxes */
    .entity rect {
      fill: #fff;
      stroke: #1a1a2e;
      stroke-width: 2;
    }
    .entity text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #1a1a2e;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* System circle */
    .system circle {
      fill: #eef2ff;
      stroke: #1a1a2e;
      stroke-width: 2.5;
    }
    .system text.sys-name {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 22px;
      font-weight: 800;
      fill: #1a1a2e;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .system text.sys-sub {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      fill: #555;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* Arrows */
    .arrow {
      fill: none;
      stroke: #333;
      stroke-width: 1.6;
      marker-end: url(#arrowhead);
    }
    .arrow-rev {
      fill: none;
      stroke: #333;
      stroke-width: 1.6;
      marker-end: url(#arrowhead);
    }

    /* Data flow labels */
    .flow-label {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 10.5px;
      fill: #1a1a2e;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .flow-label-bg {
      fill: #fff;
      opacity: 0.85;
    }

    /* Legend */
    .legend text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      fill: #333;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>
  <h1>Mental Bridge — Context Diagram (Level 0 DFD)</h1>
  <p class="subtitle">Yourdon / DeMarco notation &nbsp;·&nbsp; All external entities use plain rectangles &nbsp;·&nbsp; System boundary shown as dashed circle</p>

  <svg viewBox="0 0 1100 780" width="1100" height="780" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Arrowhead marker -->
      <marker id="arrowhead" markerWidth="8" markerHeight="6"
              refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#333" />
      </marker>

      <!-- Dashed system boundary -->
    </defs>

    <!-- ═══════════════════════════════════════════════
         SYSTEM BOUNDARY (dashed rectangle)
    ════════════════════════════════════════════════ -->
    <rect x="370" y="290" width="360" height="200"
          fill="none" stroke="#aab4c8" stroke-width="1.5"
          stroke-dasharray="8 4" rx="120" ry="120" />
    <text x="730" y="280" font-family="'Segoe UI',Arial,sans-serif"
          font-size="11" fill="#aab4c8" text-anchor="start">System Boundary</text>

    <!-- ═══════════════════════════════════════════════
         SYSTEM PROCESS (centre circle)
    ════════════════════════════════════════════════ -->
    <g class="system">
      <circle cx="550" cy="390" r="105" />
      <text class="sys-name" x="550" y="383">Mental Bridge</text>
      <text class="sys-sub"  x="550" y="403">System</text>
    </g>

    <!-- ═══════════════════════════════════════════════
         EXTERNAL ENTITIES  (plain rectangles — Yourdon standard)
    ════════════════════════════════════════════════ -->

    <!-- USER  (top centre) -->
    <g class="entity" id="ent-user">
      <rect x="460" y="30" width="180" height="55" rx="3" />
      <text x="550" y="58">User</text>
    </g>

    <!-- SPECIALIST  (right) -->
    <g class="entity" id="ent-specialist">
      <rect x="880" y="330" width="185" height="55" rx="3" />
      <text x="972" y="358">Specialist</text>
    </g>

    <!-- ADMINISTRATOR  (bottom centre) -->
    <g class="entity" id="ent-admin">
      <rect x="460" y="695" width="180" height="55" rx="3" />
      <text x="550" y="723">Administrator</text>
    </g>

    <!-- EXTERNAL LLM / AI  (left) -->
    <g class="entity" id="ent-llm">
      <rect x="30" y="230" width="180" height="60" rx="3" />
      <text x="120" y="253">External LLM /</text>
      <text x="120" y="272">AI Model Service</text>
    </g>

    <!-- PAYMENT GATEWAY  (bottom left) -->
    <g class="entity" id="ent-pay">
      <rect x="30" y="520" width="180" height="60" rx="3" />
      <text x="120" y="543">Payment Gateway</text>
      <text x="120" y="561">(MoMo / PayOS)</text>
    </g>


    <!-- ═══════════════════════════════════════════════
         DATA FLOWS
         Naming convention: DF-[from]-[to]-[n]
    ════════════════════════════════════════════════ -->

    <!-- ── USER → SYSTEM ── -->
    <path class="arrow" d="M 530 85 L 505 285" />
    <!-- label block -->
    <rect class="flow-label-bg" x="438" y="128" width="152" height="70" rx="4" />
    <text class="flow-label" x="514" y="145">account / profile / consent</text>
    <text class="flow-label" x="514" y="159">journal & assessment data</text>
    <text class="flow-label" x="514" y="173">specialist search / booking</text>
    <text class="flow-label" x="514" y="187">subscription & payment request</text>

    <!-- ── SYSTEM → USER ── -->
    <path class="arrow" d="M 572 285 L 578 85" />
    <rect class="flow-label-bg" x="578" y="128" width="162" height="70" rx="4" />
    <text class="flow-label" x="659" y="145">assessment / risk results</text>
    <text class="flow-label" x="659" y="159">resources & recommendations</text>
    <text class="flow-label" x="659" y="173">appointment / payment status</text>
    <text class="flow-label" x="659" y="187">analytics & notifications</text>

    <!-- ── SYSTEM → LLM ── -->
    <path class="arrow" d="M 447 350 L 210 268" />
    <rect class="flow-label-bg" x="270" y="278" width="158" height="32" rx="4" />
    <text class="flow-label" x="349" y="289">journal / assessment context</text>
    <text class="flow-label" x="349" y="303">benchmark evaluation input</text>

    <!-- ── LLM → SYSTEM ── -->
    <path class="arrow" d="M 210 290 L 447 372" />
    <rect class="flow-label-bg" x="252" y="318" width="160" height="32" rx="4" />
    <text class="flow-label" x="332" y="329">emotion analysis output</text>
    <text class="flow-label" x="332" y="343">model metrics / comparison</text>

    <!-- ── SYSTEM → PAYMENT ── -->
    <path class="arrow" d="M 456 448 L 210 540" />
    <rect class="flow-label-bg" x="270" y="464" width="148" height="32" rx="4" />
    <text class="flow-label" x="344" y="475">subscription payment request</text>
    <text class="flow-label" x="344" y="489">transaction data</text>

    <!-- ── PAYMENT → SYSTEM ── -->
    <path class="arrow" d="M 210 560 L 456 468" />
    <rect class="flow-label-bg" x="264" y="496" width="136" height="32" rx="4" />
    <text class="flow-label" x="332" y="507">payment result / callback</text>
    <text class="flow-label" x="332" y="521">transaction status</text>

    <!-- ── SPECIALIST → SYSTEM ── -->
    <path class="arrow" d="M 880 348 L 655 363" />
    <rect class="flow-label-bg" x="692" y="318" width="168" height="46" rx="4" />
    <text class="flow-label" x="776" y="330">profile & availability updates</text>
    <text class="flow-label" x="776" y="344">appointment decisions</text>
    <text class="flow-label" x="776" y="358">chat / follow-up actions</text>

    <!-- ── SYSTEM → SPECIALIST ── -->
    <path class="arrow" d="M 655 383 L 880 370" />
    <rect class="flow-label-bg" x="692" y="372" width="168" height="46" rx="4" />
    <text class="flow-label" x="776" y="384">appointments & permitted user data</text>
    <text class="flow-label" x="776" y="398">conversation updates</text>
    <text class="flow-label" x="776" y="412">earnings / payout status</text>

    <!-- ── ADMIN → SYSTEM ── -->
    <path class="arrow" d="M 530 695 L 505 495" />
    <rect class="flow-label-bg" x="395" y="556" width="158" height="58" rx="4" />
    <text class="flow-label" x="474" y="568">account / content administration</text>
    <text class="flow-label" x="474" y="582">specialist approval & moderation</text>
    <text class="flow-label" x="474" y="596">payment / payout management</text>
    <text class="flow-label" x="474" y="610">dataset / policy configuration</text>

    <!-- ── SYSTEM → ADMIN ── -->
    <path class="arrow" d="M 572 495 L 578 695" />
    <rect class="flow-label-bg" x="578" y="570" width="158" height="46" rx="4" />
    <text class="flow-label" x="657" y="582">platform reports & trends</text>
    <text class="flow-label" x="657" y="596">user / specialist / payment records</text>
    <text class="flow-label" x="657" y="610">benchmark results & audit logs</text>


    <!-- ═══════════════════════════════════════════════
         LEGEND
    ════════════════════════════════════════════════ -->
    <g class="legend" transform="translate(28, 680)">
      <rect x="0" y="0" width="200" height="80" rx="6"
            fill="#f0f4ff" stroke="#aab4c8" stroke-width="1" />
      <text x="10" y="18" font-weight="700" font-size="12" fill="#1a1a2e">Legend</text>

      <!-- Entity symbol -->
      <rect x="10" y="28" width="28" height="16" fill="#fff" stroke="#1a1a2e" stroke-width="2" />
      <text x="45" y="37">External Entity</text>

      <!-- Process symbol -->
      <circle cx="24" cy="58" r="10" fill="#eef2ff" stroke="#1a1a2e" stroke-width="2" />
      <text x="45" y="58">Process (System)</text>

      <!-- Arrow -->
      <line x1="10" y1="75" x2="38" y2="75" stroke="#333" stroke-width="1.6" marker-end="url(#arrowhead)" />
      <text x="45" y="76">Data Flow</text>
    </g>

  </svg>
</body>
</html>
